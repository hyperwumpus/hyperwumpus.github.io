&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);

  const isArray = Array.isArray;

    &quot;codex-visualization-widget-state&quot;,

    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),

   * @param {string} property

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);

  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;

  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {

  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }

  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };

   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);

      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {

          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||

  const connectorGlobals = {};

    const values = new Map(Object.entries(parse(mockElement.textContent)));
    mockElement.remove();

      updates: Array.from(values, ([name, value]) =&gt; ({
        name,
        revision: 1,
        state: &quot;ready&quot;,
        value: { type: &quot;json&quot;, value },
      })),
    };

      /** @param {string} name @param {(value: unknown) =&gt; void} callback */
      onData(name, callback) {
        if (typeof callback !== &quot;function&quot;) {
          throw new TypeError(&quot;onData requires a callback&quot;);
        }

          callback(values.get(name));
        } catch (error) {
          // oxlint-disable-next-line no-console -- Keep authored callback failures local.

        }

        return () =&gt; {};
      },
    };
  }
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );

  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);

        target == null ||
        globalThis.navigator.userActivation?.isActive !== true

        return;
      }

        top: target.getBoundingClientRect().top + globalThis.scrollY,

(function(){
const root=document.getElementById(&#x27;consulting-tour&#x27;);
const stops=[[&#x27;overview&#x27;,&#x27;The whole business, at a glance&#x27;],[&#x27;today&#x27;,&#x27;Know what to do next&#x27;],[&#x27;research&#x27;,&#x27;Choose a business you can help&#x27;],[&#x27;brief&#x27;,&#x27;Understand the problem before selling&#x27;],[&#x27;offer&#x27;,&#x27;Turn the problem into a paid offer&#x27;],[&#x27;delivery&#x27;,&#x27;Make and deliver the agreed work&#x27;],[&#x27;results&#x27;,&#x27;Review what the content actually did&#x27;],[&#x27;money&#x27;,&#x27;See what you earned&#x27;],[&#x27;sell&#x27;,&#x27;How you sell your service—and later the tool&#x27;]];
const menus=[[&#x27;overview&#x27;,&#x27;map&#x27;,&#x27;Overview&#x27;],[&#x27;today&#x27;,&#x27;sun&#x27;,&#x27;Today&#x27;],[&#x27;research&#x27;,&#x27;users&#x27;,&#x27;Opportunities&#x27;],[&#x27;brief&#x27;,&#x27;folder&#x27;,&#x27;Client project&#x27;],[&#x27;money&#x27;,&#x27;wallet&#x27;,&#x27;Money&#x27;],[&#x27;sell&#x27;,&#x27;presentation&#x27;,&#x27;How to sell&#x27;]];
const tabs=[[&#x27;brief&#x27;,&#x27;Brief&#x27;],[&#x27;offer&#x27;,&#x27;Offer&#x27;],[&#x27;delivery&#x27;,&#x27;Delivery&#x27;],[&#x27;results&#x27;,&#x27;Results&#x27;],[&#x27;log&#x27;,&#x27;Activity log&#x27;]];
const defaults={screen:&#x27;overview&#x27;,fee:300,hours:8,cost:20,approved:false,delivered:false,paid:false,analytics:false,clientView:false,pursue:&#x27;Pursue&#x27;,notes:[]};

function restore(s){const x=s?.privateContent?.consultingTour;if(x&amp;&amp;stops.some(p=&gt;p[0]===x.screen)||x?.screen===&#x27;log&#x27;){state={...defaults,...x};state.notes=Array.isArray(x.notes)?x.notes.slice(-8):[];}}
restore(window.openai?.widgetState);
const esc=s=&gt;String(s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
const money=n=&gt;&#x27;$&#x27;+Number(n).toLocaleString(&#x27;en-US&#x27;,{maximumFractionDigits:2});
function persist(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{preview:&#x27;personal consulting workspace&#x27;,screen:state.screen,offerFee:state.fee,measurementExampleAvailable:state.analytics},privateContent:{consultingTour:state}}).catch(()=&gt;{});}
function go(screen){state.screen=screen;state.clientView=false;render();persist();}
function button(label,screen,primary=false){return &#x27;&lt;button type=&quot;button&quot; &#x27;+(primary?&#x27;class=&quot;ct-primary&quot; &#x27;:&#x27;&#x27;)+&#x27;data-go=&quot;&#x27;+screen+&#x27;&quot;&gt;&#x27;+label+&#x27;&lt;/button&gt;&#x27;;}
function title(kicker,name,description,tag){return &#x27;&lt;div class=&quot;ct-title&quot;&gt;&lt;div&gt;&lt;span class=&quot;ct-kicker&quot;&gt;&#x27;+kicker+&#x27;&lt;/span&gt;&lt;h1&gt;&#x27;+name+&#x27;&lt;/h1&gt;&lt;p&gt;&#x27;+description+&#x27;&lt;/p&gt;&lt;/div&gt;&#x27;+(tag?&#x27;&lt;span class=&quot;ct-chip&quot;&gt;&#x27;+tag+&#x27;&lt;/span&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/div&gt;&#x27;;}
function projectTabs(){return &#x27;&lt;div class=&quot;ct-tabs&quot; aria-label=&quot;Client project sections&quot;&gt;&#x27;+tabs.map(t=&gt;&#x27;&lt;button type=&quot;button&quot; data-go=&quot;&#x27;+t[0]+&#x27;&quot; aria-pressed=&quot;&#x27;+(state.screen===t[0])+&#x27;&quot;&gt;&#x27;+t[1]+&#x27;&lt;/button&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;/div&gt;&#x27;;}
function overview(){const items=[[&#x27;research&#x27;,&#x27;1 · Find a fit&#x27;,&#x27;Business + evidenced need&#x27;,&#x27;Warm contact&#x27;],[&#x27;brief&#x27;,&#x27;2 · Understand&#x27;,&#x27;Audience + one objective&#x27;,&#x27;A clear problem&#x27;],[&#x27;offer&#x27;,&#x27;3 · Agree&#x27;,&#x27;Scope + fee + usage&#x27;,&#x27;A paid offer&#x27;],[&#x27;delivery&#x27;,&#x27;4 · Deliver&#x27;,&#x27;Asset + revision + approval&#x27;,&#x27;A finished video&#x27;],[&#x27;results&#x27;,&#x27;5 · Learn&#x27;,&#x27;Source + metric + limits&#x27;,&#x27;An honest report&#x27;],[&#x27;money&#x27;,&#x27;6 · Get paid&#x27;,&#x27;Invoice + actual receipt&#x27;,&#x27;Recorded income&#x27;]];return title(&#x27;YOUR BUSINESS LOOP&#x27;,&#x27;One client. One clear job.&#x27;,&#x27;From a useful conversation to finished, paid work.&#x27;,&#x27;Proposed small MVP&#x27;)+&#x27;&lt;div class=&quot;ct-journey&quot;&gt;&#x27;+items.map(x=&gt;&#x27;&lt;button type=&quot;button&quot; class=&quot;ct-stop&quot; data-go=&quot;&#x27;+x[0]+&#x27;&quot;&gt;&lt;span class=&quot;ct-mini&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;em&gt;&#x27;+x[3]+&#x27;&lt;/em&gt;&lt;/span&gt;&lt;span class=&quot;ct-stepname&quot;&gt;&#x27;+x[1]+&#x27; &lt;span aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;ct-stepcue&quot;&gt;&#x27;+x[2]+&#x27;&lt;/span&gt;&lt;/button&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;/div&gt;&lt;hr class=&quot;ct-rule&quot;&gt;&lt;div class=&quot;ct-callout&quot;&gt;&lt;h3&gt;Running example: MealPilot&lt;/h3&gt;&lt;p&gt;A fictional free meal-planning app needs a clearer product demo. You offer one short video, agree on usage and ask the founder to report signups.&lt;/p&gt;&lt;div class=&quot;ct-row&quot;&gt;&#x27;+button(&#x27;Walk through my day →&#x27;,&#x27;today&#x27;,true)+button(&#x27;Show how I would sell it&#x27;,&#x27;sell&#x27;)+&#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;}
function today(){return title(&#x27;MONDAY · EXAMPLE WORKSPACE&#x27;,&#x27;What moves this job forward?&#x27;,&#x27;One next action, with the context you need to resume.&#x27;)+&#x27;&lt;div class=&quot;ct-stack&quot;&gt;&lt;div class=&quot;ct-callout&quot;&gt;&lt;span class=&quot;ct-kicker&quot;&gt;NEXT USEFUL ACTION&lt;/span&gt;&lt;h2&gt;Ask MealPilot what a good beta user does.&lt;/h2&gt;&lt;p&gt;We know they want app users. We still need their audience, budget and a meaningful first action.&lt;/p&gt;&lt;div&gt;&#x27;+button(&#x27;Open the client brief →&#x27;,&#x27;brief&#x27;,true)+&#x27;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ct-columns&quot;&gt;&lt;section class=&quot;ct-box&quot;&gt;&lt;h3&gt;One active opportunity&lt;/h3&gt;&lt;p&gt;MealPilot · demo video&lt;/p&gt;&lt;p class=&quot;ct-subtle&quot;&gt;Warm introduction · budget unconfirmed&lt;/p&gt;&lt;hr class=&quot;ct-rule&quot;&gt;&lt;div class=&quot;ct-row&quot;&gt;&#x27;+button(&#x27;Review business fit&#x27;,&#x27;research&#x27;)+button(&#x27;Open activity&#x27;,&#x27;log&#x27;)+&#x27;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;ct-box&quot;&gt;&lt;h3&gt;Money means money received&lt;/h3&gt;&lt;div class=&quot;ct-price&quot;&gt;&#x27;+money(state.paid?state.fee:0)+&#x27;&lt;/div&gt;&lt;p class=&quot;ct-subtle&quot;&gt;Actual cash recorded in this example&lt;/p&gt;&lt;p class=&quot;ct-subtle&quot;&gt;Quoted value: &#x27;+money(state.fee)+&#x27; · &#x27;+(state.approved?&#x27;example accepted&#x27;:&#x27;not yet agreed&#x27;)+&#x27;&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;&lt;section class=&quot;ct-box&quot;&gt;&lt;h3&gt;Capture a conversation&lt;/h3&gt;&lt;label&gt;Notes from your last client conversation&lt;textarea id=&quot;ct-note-today&quot; placeholder=&quot;Paste what they actually said. Keep your interpretation separate.&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;div class=&quot;ct-footaction&quot;&gt;&lt;button type=&quot;button&quot; data-act=&quot;note-today&quot;&gt;Add example note to activity&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&#x27;;}
function research(){return title(&#x27;OPPORTUNITIES&#x27;,&#x27;Who can I help, and with what?&#x27;,&#x27;Research one business before making an offer.&#x27;,&#x27;Manual research first&#x27;)+&#x27;&lt;div class=&quot;ct-stack&quot;&gt;&lt;div class=&quot;ct-row&quot;&gt;&lt;span class=&quot;ct-chip&quot;&gt;Source: warm founder introduction&lt;/span&gt;&lt;span class=&quot;ct-chip ct-warm&quot;&gt;Sandbox directory: not connected&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ct-columns&quot;&gt;&lt;section class=&quot;ct-box&quot;&gt;&lt;div class=&quot;ct-row ct-between&quot;&gt;&lt;h3&gt;MealPilot&lt;/h3&gt;&lt;span class=&quot;ct-chip&quot;&gt;Fictional company&lt;/span&gt;&lt;/div&gt;&lt;p&gt;Free meal-planning web app&lt;/p&gt;&lt;hr class=&quot;ct-rule&quot;&gt;&lt;div class=&quot;ct-stack&quot;&gt;&lt;div class=&quot;ct-field&quot;&gt;&lt;span&gt;Business model&lt;/span&gt;&lt;span&gt;Free beta; future monetization unknown&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ct-field&quot;&gt;&lt;span&gt;Audience hypothesis&lt;/span&gt;&lt;span&gt;Busy students who need a simple weekly meal plan&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ct-field&quot;&gt;&lt;span&gt;Observed opportunity&lt;/span&gt;&lt;span&gt;The page describes features; a short demo could show the first useful action.&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ct-field&quot;&gt;&lt;span&gt;Still unconfirmed&lt;/span&gt;&lt;span&gt;Budget, target audience, analytics access and demand for content&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;ct-box&quot;&gt;&lt;h3&gt;A service you could propose&lt;/h3&gt;&lt;p&gt;One product-demo video for the brand’s own channels.&lt;/p&gt;&lt;p class=&quot;ct-subtle&quot;&gt;This is a service-fit hypothesis, not an automatic recommendation or sale.&lt;/p&gt;&lt;hr class=&quot;ct-rule&quot;&gt;&lt;label&gt;Your decision&lt;select id=&quot;ct-decision&quot;&gt;&lt;option &#x27;+(state.pursue===&#x27;Pursue&#x27;?&#x27;selected&#x27;:
